name: StillsTest
options:
  bundleIdPrefix: com.stills.app
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "" # O'zingizning Apple Developer Team ID'ingizni qo'ying

targets:
  StillsTest:
    type: application
    platform: iOS
    sources:
      - path: StillsTest
    dependencies:
      - target: StillsMonitor
      - target: StillsShieldConfig
      - target: StillsShieldAction
    info:
      path: StillsTest/Info.plist
    entitlements:
      path: StillsTest/StillsTest.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.stills.app

  StillsMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: StillsMonitor
      - path: StillsTest/Shared.swift # Monitor targeti uchun Shared.swift zarur
    info:
      path: StillsMonitor/Info.plist
    entitlements:
      path: StillsMonitor/StillsMonitor.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.stills.app.StillsMonitor

  StillsShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: StillsShieldConfig
    info:
      path: StillsShieldConfig/Info.plist
    entitlements:
      path: StillsShieldConfig/StillsShieldConfig.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.stills.app.StillsShieldConfig

  StillsShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: StillsShieldAction
    info:
      path: StillsShieldAction/Info.plist
    entitlements:
      path: StillsShieldAction/StillsShieldAction.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.stills.app.StillsShieldAction

